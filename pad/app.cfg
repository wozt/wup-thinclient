# wupstream: a WUP ThinServer desktop on the Wii U GamePad. The server side is
# wup-thinserver (libwupstream). This app is the receiver: hardware H.264
# decode, PCM audio, input report, plus a local server-selection menu.
name = WUP ThinClient
author = wozt
version = 0.1.0
description = Linux desktop from a WUP ThinServer
icon = icon.png
url = https://github.com/wozt/wup-thinclient
net = yes
defines = WUP_NETIF_RING=65536 WUP_NET_PBUF_POOL=80 WUP_NET_UDP_QUEUE=96
